<div class="container">

    <div class="page-title">
        <h1>Add New Item</h1>
        <p>Fill in the details below to add a new inventory item.</p>
    </div>

    <div class="card">
        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label>Item Name <span style="color: red;">*</span></label>
                    <input type="text" placeholder="e.g. Wireless Mouse" required>
                </div>

                <div class="form-group">
                    <label>Item Code <span style="color: red;">*</span></label>
                    <input type="text" placeholder="e.g. WM-2026-001" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select>
                        <option>Electronics</option>
                        <option>Accessories</option>
                        <option>Furniture</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" value="0" required>
                </div>

                <div class="form-group">
                    <label>Unit Price ($) <span style="color: red;">*</span></label>
                    <input type="number" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group full">
                    <label>Priority Level</label>
                    <div class="radio-group">
                        <label><input type="radio" name="priority"> Low</label>
                        <label><input type="radio" name="priority"> Normal</label>
                        <label><input type="radio" name="priority"> High</label>
                        <label><input type="radio" name="priority"> Urgent</label>
                    </div>
                </div>

                <div class="form-group full">
                    <label>Storage Location</label>
                    <div class="radio-group">
                        <label><input type="radio" name="location"> Warehouse A</label>
                        <label><input type="radio" name="location"> Warehouse B</label>
                        <label><input type="radio" name="location"> Warehouse C</label>
                    </div>
                </div>

                <div class="form-group full">
                    <label>Item Tags</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox"> Fragile</label>
                        <label><input type="checkbox"> Heavy</label>
                        <label><input type="checkbox"> Perishable</label>
                        <label><input type="checkbox"> Hazardous</label>
                        <label><input type="checkbox"> Oversized</label>
                    </div>
                </div>

                <div class="form-group full">
                    <label>Notifications</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox"> Low stock alert</label>
                        <label><input type="checkbox"> Price change alert</label>
                    </div>
                </div>

                <div class="form-group full">
                    <label>Description</label>
                    <textarea placeholder="Optional description of the item..."></textarea>
                </div>

            </div>

            <button type="submit">✔ Add Item to Inventory</button>

        </form>
    </div>

</div>
